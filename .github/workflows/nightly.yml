# Nightly property and golden runs (docs/test-plan.md §3.2, §3.5, §6). Every property runs ×10 with a fresh seed; the seed is printed at the start, and a failure prints
# the seed of the failing case and the case itself, so it can be replayed locally with `PROPERTY_SEED=<seed> pnpm test:properties`. Actions are pinned to full commit SHAs
# (version in a comment); Dependabot keeps them current.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Base seed for the property tests (default: the run id)"
        required: false

permissions:
  contents: read

jobs:
  properties:
    name: Properties ×10 with a fresh seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Every engine test, properties ×10
        run: pnpm test:properties:nightly
        env:
          PROPERTY_RUNS: "10"
          PROPERTY_SEED: ${{ github.event.inputs.seed || github.run_id }}

  golden:
    name: Golden cases (report; blocking only after M3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Concordance by split
        run: pnpm golden
