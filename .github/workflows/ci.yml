# Continuous integration (docs/release-process.md §4, docs/test-plan.md §6). Fast checks, the knowledge-base build (determinism + validation), and both builds
# with the release assertions. Required on `main`. Actions are pinned to full commit SHAs (with the version in a comment); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:kb-types
      - run: pnpm check:notices
      - run: pnpm check:i18n
      - run: pnpm check:icons
      - run: pnpm check:hygiene
      - run: pnpm test
      - name: Safety vignette suite (blocks the release)
        run: pnpm test:safety
      - name: Engine benchmark (assess p95 ≤ 50 ms; no more than 20 % slower than the baseline)
        run: pnpm bench:check
      - run: pnpm test:tools

  deps:
    name: Dependencies (licences, advisories, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Licence allow-list (shipped dependencies must be permissive; scripts/licenses.json)
        run: pnpm check:licenses
      - name: Known vulnerabilities in what ships (high and critical block)
        run: pnpm --filter @tcm/web audit --prod --audit-level high
      - name: Known vulnerabilities in build-time tools (reported, not blocking)
        run: pnpm audit --audit-level high || echo "::warning::build-time dependencies have advisories; see the log"
      - name: Licence report and SBOM
        run: |
          mkdir -p reports
          node scripts/licenses.ts report reports/licenses.md
          node scripts/licenses.ts sbom reports/sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-reports
          path: reports
          retention-days: 90

  kb:
    name: Knowledge base (build is deterministic, data is valid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python3 -m venv .venv && .venv/bin/pip install -r scripts/requirements.txt
      - run: .venv/bin/python -m scripts.kb.build_kb
      - name: The committed data equals the data the build regenerates
        run: git diff --exit-code -- data
      - run: .venv/bin/python -m scripts.kb.export_parity_cases
      - name: The committed parity fixtures equal what the Python oracle exports
        run: git diff --exit-code -- packages/engine/test/fixtures
      - name: The Simplified-Chinese dictionary and catalogues equal what the build produces
        run: .venv/bin/python -m scripts.i18n.build_hans --check
      - run: .venv/bin/python -m unittest discover -s scripts/kb/tests -t .
      - run: .venv/bin/python -m unittest discover -s scripts/i18n/tests -t .

  build:
    name: Build both profiles and check the release output
    needs: [fast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Release build (profile release)
        run: pnpm build
        env:
          APP_BUILD_ID: ${{ github.sha }}
          APP_DRAFT_LABEL: "on"        # the recorded closed-beta state: also makes the build noindex (check-release rule 8)
      - name: Release assertions on the built output
        # the content is still a draft: the closed-beta exception (draft label on) is the recorded state until the review records exist
        run: node scripts/check-release.ts --dist apps/web/dist --draft-label
      - name: Size budgets (initial JS ≤ 200 KB gzip, lazy chunks, CSS, knowledge base per session)
        run: node scripts/check-budgets.ts --dist apps/web/dist
      - name: Smoke test the output behind a Pages-like host (headers, SPA fallback, real 404, knowledge-base caching)
        run: |
          node scripts/serve-dist.ts apps/web/dist 8788 &
          sleep 2
          node scripts/smoke.ts http://127.0.0.1:8788 --noindex
      - name: The release, i18n, hygiene, licence and smoke checkers reject every seeded violation
        run: pnpm test:scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-release
          path: apps/web/dist
          retention-days: 14
      - name: Dev build (profile dev, previews only)
        run: pnpm build:dev
        env:
          APP_BUILD_ID: ${{ github.sha }}

  e2e:
    name: End-to-end scenarios E1–E20 and axe in a real browser
    needs: [fast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Browser for Playwright
        run: pnpm --filter @tcm/web exec playwright install --with-deps chromium
      - name: Both builds (release with the draft label, and dev), as the host serves them
        run: pnpm --filter @tcm/web build:e2e
        env:
          APP_BUILD_ID: ${{ github.sha }}
      - name: Scenarios (desktop and mobile, zh-Hant and en; the dev profile where a scenario needs it)
        run: pnpm --filter @tcm/web exec playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
          retention-days: 14

  lighthouse:
    name: Lighthouse (mobile, throttled)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Release build (closed-beta state)
        run: pnpm build
        env:
          APP_DRAFT_LABEL: "on"
      - name: Lighthouse on the landing, start and sources pages in both languages
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
